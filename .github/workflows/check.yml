name: Quality checks
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test --run
      - run: bun run build
      - name: Verify committed browser bundles
        run: git diff --exit-code -- public/js
