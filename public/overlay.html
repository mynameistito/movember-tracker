<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Movember donation overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <section
      id="overlayContainer"
      data-position="bottomright"
      aria-label="Movember donation progress"
    >
      <div class="totals">
        <div>
          <p class="label">MOVEMBER</p>
          <p id="amount" aria-live="polite">Loading…</p>
        </div>
        <p id="target"></p>
      </div>
      <div
        class="track"
        role="progressbar"
        aria-label="Fundraising goal"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progressBar"></div>
      </div>
      <p id="status" role="status"></p>
    </section>
    <script type="module" src="/js/overlay.js"></script>
  </body>
</html>
